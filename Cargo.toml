[package]
name = "simpleload-balancer-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
